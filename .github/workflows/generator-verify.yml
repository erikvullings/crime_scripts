name: Generator verify

on:
  pull_request:
    paths:
      - ".agents/skills/crime-script-generator/**"
      - ".github/workflows/generator-*.yml"
      - "packages/crime-script-core/**"
      - "packages/script-generator/**"
      - "packages/gui/src/models/**"
      - "packages/gui/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".agents/skills/crime-script-generator/**"
      - ".github/workflows/generator-*.yml"
      - "packages/crime-script-core/**"
      - "packages/script-generator/**"
      - "packages/gui/src/models/**"
      - "packages/gui/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crime-script/core test
      - run: pnpm --filter @crime-script/generator test
      - run: pnpm --filter @crime-script/core typecheck
      - run: pnpm --filter @crime-script/generator typecheck
      - run: pnpm --filter crime_scrips typecheck
      - run: pnpm --filter @crime-script/generator build:binary
      - run: ./packages/script-generator/dist/crime-script-generator --version
